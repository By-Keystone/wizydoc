<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px 0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#000000;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background-color:#ffffff;">
            <tr>
              <td style="padding:40px;">
                <p style="margin:0 0 16px;font-size:20px;font-weight:bold;">Hola,</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Alguien intentó crear una cuenta en WizyDoc con este correo. Ya tienes una cuenta con él.</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Si fuiste tú, inicia sesión:</p>
                <p style="margin:24px 0;"><a href="{{loginUrl}}" style="display:inline-block;padding:12px 24px;background-color:#0E8C82;color:#ffffff;font-size:16px;text-decoration:none;border-radius:4px;">Iniciar sesión</a></p>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Si no fuiste tú, te recomendamos cambiar tu contraseña:</p>
                <p style="margin:24px 0;"><a href="{{forgotPasswordUrl}}" style="display:inline-block;padding:12px 24px;background-color:#0E8C82;color:#ffffff;font-size:16px;text-decoration:none;border-radius:4px;">Cambiar contraseña</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
